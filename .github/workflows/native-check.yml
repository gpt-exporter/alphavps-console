name: Native check

# Runs native tests and produces a signed standalone Android Release APK.
on:
  push:
    branches: [main, "dev-*", "feature/termoz-android"]
    paths:
      - "modules/**"
      - "plugins/**"
      - "app.json"
      - ".github/workflows/native-check.yml"
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build
        type: choice
        default: both
        options: [both, android, ios]

concurrency:
  group: native-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    if: inputs.platforms != 'ios'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - name: Prebuild
        env:
          TERMOZ_RELEASE_SIGNING: "1"
        run: npx expo prebuild --platform android --no-install --clean
      - name: Kotlin unit tests
        working-directory: android
        run: ./gradlew --console=plain :termix-pipe:testDebugUnitTest :termix-terminal:testDebugUnitTest :termix-display:testDebugUnitTest
      - name: Restore signing key
        shell: bash
        env:
          TERMOZ_KEYSTORE_BASE64: ${{ secrets.TERMOZ_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$TERMOZ_KEYSTORE_BASE64"
          printf "%s" "$TERMOZ_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/termoz-release.p12"
          chmod 600 "$RUNNER_TEMP/termoz-release.p12"
      - name: Build signed Release APK (ARM64)
        working-directory: android
        env:
          TERMOZ_KEYSTORE_PATH: ${{ runner.temp }}/termoz-release.p12
          TERMOZ_KEYSTORE_PASSWORD: ${{ secrets.TERMOZ_KEYSTORE_PASSWORD }}
        run: |
          test -s "$TERMOZ_KEYSTORE_PATH"
          test -n "$TERMOZ_KEYSTORE_PASSWORD"
          ./gradlew --console=plain :app:assembleRelease -PreactNativeArchitectures=arm64-v8a
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-reports
          path: android/**/build/reports/tests
      - name: Upload Termoz APK
        uses: actions/upload-artifact@v4
        with:
          name: termoz-android-arm64-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  ios:
    name: iOS
    if: github.event_name == 'workflow_dispatch' && inputs.platforms != 'android'
    runs-on: blacksmith-6vcpu-macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - name: Prebuild
        run: npx expo prebuild --platform ios --clean
      - name: Build for the simulator
        working-directory: ios
        run: |
          xcodebuild -workspace Termix.xcworkspace -scheme Termix -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ../dd CODE_SIGNING_ALLOWED=NO build > ../xcodebuild.log 2>&1 \
            || { grep -E "error:|BUILD FAILED" ../xcodebuild.log | sort -u | head -80; exit 1; }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: xcodebuild.log
